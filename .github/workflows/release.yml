name: Release

# Builds a signed Windows installer and publishes a GitHub Release with the
# latest.json manifest the in-app updater reads (docs/decisions/0001).
# Runs when a push changes package.json or .github/release-notes.md and the
# version in package.json has no GitHub Release yet; otherwise it does
# nothing. So a release is: bump the version in package.json, Cargo.toml and
# src-tauri/tauri.conf.json, write .github/release-notes.md, push. Can also
# be started from the Actions tab once this file is on the default branch.
# Needs the repository secret
# TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the
# key has one).

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["package.json", ".github/release-notes.md"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed (shown in the app); defaults to .github/release-notes.md"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this version new?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      released: ${{ steps.v.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; bump the version to publish a new one."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Wait for CI on this commit
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a successful CI run before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
              exit 0
            fi
            sleep 5
          done
          echo "::error::No CI run found for this commit; release was not published."
          exit 1

  windows:
    name: Build, sign and publish
    needs: [check, ci]
    if: needs.check.outputs.released == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Check the signing key is configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret first (see docs/RELEASING.md)."
            exit 1
          fi
      - name: Release notes
        id: notes
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "body<<END_OF_NOTES"
            if [ -n "$NOTES" ]; then echo "$NOTES"; else cat .github/release-notes.md; fi
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Mimi Kopi v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json
